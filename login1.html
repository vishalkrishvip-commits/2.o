<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
                url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            width: 380px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 35px;
            color: white;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .options a {
            color: #fff;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6b00;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #e65c00;
        }

    .signup {
            text-align: center;
            margin-top: 20px;
        }

        .signup a {
            color: #ffcc99;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <div class="logo">🍔</div>
        <h2>Food Delivery Login</h2>

        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
            </div>

            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember Me
                </label>
                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
            <div class="signup" style="margin-top: 10px;">
                <a href="admin.html" style="color: #ffcc99; font-size: 13px;">🔒 Admin Dashboard</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            // Admin login check
            if (email === "admin@freshcart.com" && password === "admin123") {
                alert("Welcome, Admin!");
                window.location.href = "admin.html";
            } else {
                alert("Login Successful!");
                window.location.href = "home.html";
            }
        });
    </script>

</body>

</html>
